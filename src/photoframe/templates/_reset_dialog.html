  <dialog class="reset-dialog" data-reset-dialog aria-labelledby="reset-dialog-title" aria-describedby="reset-dialog-description">
    <form method="dialog" class="reset-dialog-card"><div><p class="kicker">RESET & RECOVERY</p><h2 id="reset-dialog-title">Reset Photoframe?</h2><p id="reset-dialog-description">This clears your saved Immich key, album choice, frame settings and local photo cache. Photoframe will return to HTTP at 127.0.0.1:8000 and may restart. You’ll need your Immich URL and API key to set it up again. The app and system service stay installed.</p></div><div class="reset-dialog-actions"><button type="submit" value="cancel" class="secondary" autofocus>Keep current settings</button><button type="button" class="danger-button" onclick="confirmPhotoframeReset(this)">Reset to defaults</button></div></form>
    <form data-reset-form method="post" action="/reset" hx-post="/reset" hx-target="#workspace" hx-swap="outerHTML" hx-sync="this:drop"></form>
  </dialog>

      <details class="setting-card" name="frame-settings" data-settings-panel="provider" data-default-open="true" open><summary><span class="setting-summary-main"><small>01</small><strong>Photo provider</strong></span><span class="setting-summary-end"><span class="setting-status">{{ 'Connected' if settings.verification.ok else 'Needs attention' }}</span><span class="disclosure-icon" aria-hidden="true"></span></span></summary>
        <form method="post" action="/connection" hx-post="/connection" hx-target="#workspace" hx-swap="outerHTML" class="form-grid">
          <label>Provider<select name="provider_kind"><option value="immich">Immich</option></select></label><label>Server URL<input name="server_url" type="url" required placeholder="https://photos.example.com" value="{{ settings.provider.server_url or '' }}"></label><label class="span-2">API key<input name="api_key" type="password" {% if not credential_saved and not demo_mode %}required{% endif %} autocomplete="new-password" placeholder="{{ 'Saved — leave blank to keep it' if credential_saved else 'Paste an Immich API key' }}"><small>Never returned to the browser after saving.</small></label><div class="form-actions span-2"><button class="primary">Save & verify</button><span>{{ settings.verification.message }}</span></div>
        </form>
      </details>

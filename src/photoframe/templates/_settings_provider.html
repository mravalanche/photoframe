      <section class="setting-card" data-settings-panel="provider" aria-labelledby="provider-title"><div class="settings-intro"><h2 id="provider-title" tabindex="-1">Photo provider</h2><p>{{ 'Connected' if settings.verification.ok else 'Needs attention' }}</p></div>
        <form method="post" action="/connection" hx-post="/connection" hx-target="#workspace" hx-swap="outerHTML" class="form-grid">
          <label>Provider<select name="provider_kind"><option value="immich">Immich</option></select></label><label>Server URL<input name="server_url" type="url" required placeholder="https://photos.example.com" value="{{ settings.provider.server_url or '' }}"><small>A new server needs a new API key.</small></label><label class="span-2">API key<input name="api_key" type="password" {% if not credential_saved and not demo_mode %}required{% endif %} autocomplete="new-password" placeholder="{{ 'Saved — leave blank to keep it' if credential_saved else 'Paste an Immich API key' }}"><small>The key is never shown again. Changing the server or key clears the album choice, hidden photos and local cache.</small></label><div class="form-actions span-2"><button class="primary">Save & verify</button><span>{{ settings.verification.message }}</span></div>
        </form>
      </section>

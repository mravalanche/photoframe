<section class="setting-card hardware-settings" aria-labelledby="hardware-title">
  <div class="settings-intro"><h2 id="hardware-title">Display hardware</h2><p>Configure the physical frame. Saving does not change the displayed photo or reset its schedule.</p></div>
  <form method="post" action="/hardware" hx-post="/hardware" hx-target="#workspace" hx-swap="outerHTML" class="form-grid">
<div class="advanced-settings-grid"><label>Display driver<select name="display_driver"><option value="auto" {{ 'selected' if settings.device.display_driver.value == 'auto' }}>Auto-detect Pimoroni Inky</option><option value="inky" {{ 'selected' if settings.device.display_driver.value == 'inky' }}>Pimoroni Inky</option><option value="mock" {{ 'selected' if settings.device.display_driver.value == 'mock' }}>Mock (development)</option></select><small>{{ settings.device.display_status }}</small></label><label>Display model<input name="display_model" value="{{ settings.device.display_model or '' }}" placeholder="e.g. Inky Impression 7.3"><small>Filled automatically when detection works.</small></label><label>Native width<input name="display_width_px" type="number" min="1" max="16384" value="{{ settings.device.display_width_px or '' }}"><small>Manual fallback, in pixels.</small></label><label>Native height<input name="display_height_px" type="number" min="1" max="16384" value="{{ settings.device.display_height_px or '' }}"><small>Enter width and height together.</small></label><label>Typical refresh time<input name="expected_refresh_seconds" type="number" min="5" max="300" value="{{ settings.device.expected_refresh_seconds }}"><small>Seconds. Used only to set expectations in status messages; it does not measure progress.</small></label><label>Frame response timeout<input name="render_timeout_seconds" type="number" min="10" max="600" value="{{ settings.device.render_timeout_seconds }}"><small>Maximum seconds to wait for the e-ink busy signal to clear. After this, the update is reported as failed.</small></label></div><div class="form-actions span-2"><button class="primary">Save hardware settings</button></div>
  </form>
</section>

{# One stroke family for navigation and recurring actions. #}
{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == 'frame' %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 16l4-4 3 3 3-4 3 5"/>
  {% elif name == 'photos' %}<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M9 4v16"/>
  {% elif name == 'updates' %}<path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/>
  {% elif name == 'settings' %}<path d="M12 3l1.3 2.1 2.4.4.7 2.3 2.2 1.1-.5 2.3 1 2.2-1.7 1.7.1 2.5-2.3.8L13.8 20H11l-1.3-2.1-2.4-.4-.7-2.3-2.2-1.1.5-2.3-1-2.2 1.7-1.7-.1-2.5 2.3-.8L10.2 3z"/><circle cx="12" cy="11.5" r="2.5"/>
  {% elif name == 'chevron-right' %}<path d="M9 5l7 7-7 7"/>
  {% elif name == 'close' %}<path d="M5 5l14 14M19 5L5 19"/>
  {% elif name == 'check' %}<path d="M4 12l5 5L20 6"/>
  {% elif name == 'theme' %}<circle cx="12" cy="12" r="8"/><path d="M12 4v16M12 4a8 8 0 0 1 0 16" fill="currentColor" stroke="none"/>
  {% endif %}
</svg>
{%- endmacro %}

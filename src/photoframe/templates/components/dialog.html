{# The caller may contain a form; the close form is a sibling, never nested. #}
{% macro dialog(id, title, description='') -%}
<dialog id="{{ id }}" class="modal" aria-labelledby="{{ id }}-title"{% if description %} aria-describedby="{{ id }}-description"{% endif %}><div class="modal-box"><h2 id="{{ id }}-title" class="text-lg font-semibold">{{ title }}</h2>{% if description %}<p id="{{ id }}-description" class="py-2 text-sm text-base-content/70">{{ description }}</p>{% endif %}<div class="py-4">{{ caller() }}</div><div class="modal-action"><form method="dialog"><button class="btn btn-ghost" type="submit">Close</button></form></div></div><form method="dialog" class="modal-backdrop"><button aria-label="Close dialog">close</button></form></dialog>
{%- endmacro %}

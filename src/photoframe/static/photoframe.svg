<svg id="photoframe-inked-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Photoframe — Inked Pixels</title>
  <desc id="desc">A framed mountain photograph emerging from square pixels as if inked onto an e-paper display.</desc>
  <!-- Recolour these three variables to match the existing application theme. -->
  <style>
    :root { --icon-bg: #1c2721; --icon-ink: #fffefa; --icon-mid: #999d98; }
    .bg { fill: var(--icon-bg); }
    .ink { fill: var(--icon-ink); }
    .mid { fill: var(--icon-mid); }
    .stroke { stroke: var(--icon-ink); }
  </style>
  <rect width="512" height="512" rx="104" class="bg"/>
  <!-- The left edge resolves from separate square ink pixels into a frame. -->
  <g class="ink">
    <rect x="93" y="195" width="17" height="17" rx="1"/>
    <rect x="133" y="167" width="15" height="15" rx="1"/>
    <rect x="151" y="215" width="21" height="21" rx="1"/>
    <rect x="109" y="254" width="23" height="23" rx="1"/>
    <rect x="74" y="276" width="14" height="14" rx="1"/>
    <rect x="145" y="287" width="17" height="17" rx="1"/>
    <rect x="182" y="186" width="14" height="14" rx="1"/>
    <rect x="176" y="248" width="27" height="27" rx="1"/>
    <rect x="125" y="327" width="14" height="14" rx="1"/>
    <rect x="174" y="336" width="19" height="19" rx="1"/>
    <rect x="217" y="298" width="13" height="13" rx="1"/>
  </g>
  <!-- Clear, bold picture border; deliberately simplified for 32px favicon size. -->
  <path d="M215 145 H397 Q414 145 414 163 V349 Q414 366 396 366 H213" fill="none" class="stroke" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M196 145 H173 M173 366 H196" fill="none" class="stroke" stroke-width="15" stroke-linecap="round"/>
  <!-- Image area is clipped to the photo frame. -->
  <clipPath id="picture"><rect x="203" y="164" width="193" height="183" rx="2"/></clipPath>
  <g clip-path="url(#picture)">
    <circle cx="267" cy="215" r="22" class="ink"/>
    <path d="M203 310 L255 259 L293 285 L330 237 L396 313 V348 H203Z" class="mid"/>
    <path d="M203 332 L256 299 L290 320 L352 274 L396 311 V350 H203Z" class="ink"/>
    <path d="M203 349 L260 325 L300 345 L361 307 L396 331 V350Z" class="mid"/>
  </g>
  <!-- Pixels across the open, inking edge intentionally overlap the photo. -->
  <g class="ink">
    <rect x="194" y="170" width="11" height="11"/>
    <rect x="194" y="198" width="18" height="18"/>
    <rect x="206" y="231" width="12" height="12"/>
    <rect x="191" y="277" width="20" height="20"/>
    <rect x="198" y="322" width="11" height="11"/>
  </g>
</svg>

[project]
name = "photoframe"
version = "1.0.0"
description = "Configure and verify a provider-backed digital photo frame"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=44.0",
  "fastapi>=0.115",
  "httpx>=0.28",
  "jinja2>=3.1",
  "pydantic>=2.10",
  "pillow>=11.0",
  "python-multipart>=0.0.20",
  "tomli-w>=1.2",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
# Install this extra on the Raspberry Pi. Keeping GPIO support optional means
# normal development hosts and the test suite do not need Pi-specific packages.
inky = ["inky>=2.0"]

[project.scripts]
photoframe = "photoframe.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photoframe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["archive", ".tools", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
